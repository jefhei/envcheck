[project]
name = "envcheck"
version = "0.1.0"
description = "Environment Parity Checker — detect drift across dev/staging/prod"
authors = [{ name = "Jeff H", email = "jefhei@users.noreply.github.com" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
envcheck = "envcheck.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envcheck"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
